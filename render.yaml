services:
  - type: web
    name: sr-enterprises-crm-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @crm/web build
    startCommand: pnpm --filter @crm/api start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=384 --expose-gc
      - key: COOKIE_SAME_SITE
        value: none
      - key: USE_POSTGRES
        value: "true"
      - key: DB_MAX_CONNECTIONS
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ARCHIVE_DATABASE_URL
        sync: false
